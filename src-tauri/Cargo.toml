[workspace]
members = ["crates/engine-types", "crates/engine"]

[workspace.package]
edition = "2021"
version = "2.5.0"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"

[package]
name = "speakly"
version.workspace = true
description = "Speech to text, instantly. Private, on-device dictation and transcription for macOS."
authors = ["Jonathan Asher"]
edition.workspace = true

[lib]
name = "speakly_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
speakly-engine = { path = "crates/engine" }
speakly-engine-types = { path = "crates/engine-types" }
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-opener = "2"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
tauri-plugin-global-shortcut = "2"
arboard = "3.6.1"
core-graphics = { version = "0.25.0", features = ["elcapitan"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
keyring = { version = "3", features = ["apple-native"] }
reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "rustls", "json"] }
tauri-plugin-autostart = "2"
objc2-av-foundation = { version = "0.3.2", features = ["AVCaptureDevice", "AVMediaFormat"] }
tauri-plugin-updater = "2.10.1"
tauri-plugin-process = "2.3.1"
tracing-appender = "0.2.5"
tauri-plugin-dialog = "2"
base64 = "0.23.1"
objc2 = "0.6.4"
core-foundation = "0.10.1"
libc = "0.2.189"
objc2-app-kit = { version = "0.3.2", features = ["NSWorkspace", "NSRunningApplication"] }
