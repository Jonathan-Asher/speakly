[workspace]
members = ["crates/engine-types", "crates/engine"]

[workspace.package]
edition = "2021"
version = "2.0.0"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"

[package]
name = "speakly"
version.workspace = true
description = "Speech to text, instantly. Private, on-device dictation and transcription for macOS."
authors = ["Jonathan Asher"]
edition.workspace = true

[lib]
name = "speakly_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
speakly-engine = { path = "crates/engine" }
speakly-engine-types = { path = "crates/engine-types" }
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-opener = "2"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
tauri-plugin-global-shortcut = "2"
arboard = "3.6.1"
core-graphics = "0.25.0"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
